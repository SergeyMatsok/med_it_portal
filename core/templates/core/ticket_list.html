{% extends 'core/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>🆘 Заявки в IT</h3>
  <a href="{% url 'support_ticket' %}" class="btn btn-primary">+ Новая заявка</a>
</div>
<div class="list-group">
  {% for t in tickets %}
    <a href="{% url 'ticket_detail' t.id %}" class="list-group-item list-group-item-action">
      <div class="d-flex w-100 justify-content-between">
        <h6 class="mb-1">#{{ t.id }} {{ t.message|truncatechars:60 }}</h6>
        <span class="badge bg-{% if t.status == 'new' %}primary{% elif t.status == 'in_progress' %}warning{% elif t.status == 'resolved' %}success{% else %}secondary{% endif %}">
          {{ t.get_status_display }}
        </span>
      </div>
      <small class="text-muted">От: {{ t.author }} | {{ t.created_at|date:"d.m.Y H:i" }}</small>
    </a>
  {% empty %}
    <div class="list-group-item text-muted">Заявок нет</div>
  {% endfor %}
</div>
{% endblock %}
