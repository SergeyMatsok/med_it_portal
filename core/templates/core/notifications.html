{% extends 'core/base.html' %}
{% block content %}
<h3>🔔 Уведомления</h3>
<div class="list-group">
  {% for n in notifications %}
    <div class="list-group-item {% if not n.is_read %}list-group-item-light{% endif %}">
      <div class="d-flex w-100 justify-content-between">
        <h6 class="mb-1">{{ n.get_notif_type_display }} {{ n.message }}</h6>
        <small class="text-muted">{{ n.created_at|timesince }} назад</small>
      </div>
      {% if n.link %}
        <a href="{{ n.link }}" class="btn btn-sm btn-outline-primary mt-1">Перейти</a>
      {% endif %}
    </div>
  {% empty %}
    <div class="list-group-item text-muted">Нет уведомлений</div>
  {% endfor %}
</div>
{% endblock %}
